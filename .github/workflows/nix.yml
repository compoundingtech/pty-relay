name: Nix
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      # `nix flake check` rather than `nix build`, so the checks.* gate too.
      - run: nix flake check --print-build-logs
